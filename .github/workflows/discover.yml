name: 仕入れ候補さがし

on:
  schedule:
    - cron: "23 * * * *"   # 1時間ごと（GitHubの混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:

concurrency:
  group: discover   # 在庫監視とは別に動く（待たされない）
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: 候補をさがす
        run: python monitor.py discover
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: 自動実行が60日で止まらないようにする
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/discover.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
